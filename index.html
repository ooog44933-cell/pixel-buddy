<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pixel Buddy" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Pixel Buddy</title>
  <style>
    :root {
      --bg-1: #1a1a2e;
      --bg-2: #16213e;
      --panel: #0f1626;
      --wall: #2d3561;
      --wall-dark: #232a4d;
      --desk: #6b4423;
      --desk-dark: #4a2f18;
      --accent: #7c5cff;
      --text: #e8e8f0;
      --text-dim: #9aa0b5;
      --bubble-me: #7c5cff;
      --bubble-ai: #252d47;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      overscroll-behavior: none;
    }

    .app {
      display: flex;
      height: 100dvh;
      width: 100vw;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    }

    /* ============ ЛЕВАЯ ПАНЕЛЬ: СЦЕНА ============ */
    .scene-panel {
      flex: 0 0 42%;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #0003;
      background: #0b1020;
    }

    .scene {
      position: relative;
      flex: 1;
      overflow: hidden;
      image-rendering: pixelated;
      min-height: 0;
    }

    .wall {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, var(--wall) 0 16px, var(--wall-dark) 16px 20px),
        var(--wall);
    }

    .window {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 42%;
      height: 28%;
      background: #6cc3ff;
      border: 6px solid #c9d0e0;
      border-bottom-width: 8px;
      box-shadow: inset 0 0 0 2px #0003;
      overflow: hidden;
    }
    .window-sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(#87ceeb, #b3e5ff);
      animation: skyShift 20s linear infinite;
    }
    .window-cross-v,
    .window-cross-h {
      position: absolute;
      background: #c9d0e0;
      box-shadow: 0 0 0 1px #0003;
    }
    .window-cross-v { left: 50%; top: 0; width: 6px; height: 100%; transform: translateX(-50%); }
    .window-cross-h { top: 50%; left: 0; height: 6px; width: 100%; transform: translateY(-50%); }

    @keyframes skyShift {
      0%   { background: linear-gradient(#87ceeb, #b3e5ff); }
      50%  { background: linear-gradient(#ffd89b, #ffb56b); }
      100% { background: linear-gradient(#87ceeb, #b3e5ff); }
    }

    .plant { position: absolute; bottom: 24%; width: 60px; height: 90px; }
    .plant-left { left: 3%; }
    .plant-right { right: 3%; }

    .pot {
      position: absolute;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 32px; height: 24px;
      background: #b5651d;
      border: 2px solid #7a4312;
      border-radius: 0 0 4px 4px;
    }
    .leaves {
      position: absolute;
      bottom: 24px; left: 50%; transform: translateX(-50%);
      width: 60px; height: 60px;
    }
    .leaf {
      position: absolute;
      width: 20px; height: 24px;
      background: #2ecc71;
      border: 2px solid #1e8f4f;
      border-radius: 50% 50% 50% 0;
      transform-origin: bottom center;
      animation: sway 3s ease-in-out infinite;
    }
    .leaf.l1 { left: 20px; top: 4px;  transform: rotate(-20deg); }
    .leaf.l2 { left: 0px;  top: 20px; transform: rotate(-45deg); animation-delay: .4s; }
    .leaf.l3 { left: 40px; top: 20px; transform: rotate(20deg);  animation-delay: .8s; }
    .leaf.l4 { left: 20px; top: 0px;  transform: rotate(0deg);   animation-delay: 1.2s; }

    @keyframes sway {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.15); }
    }

    .character {
      position: absolute;
      bottom: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 110px;
      z-index: 5;
      animation: breathe 3s ease-in-out infinite;
    }
    .character.working { animation: workBob 0.6s ease-in-out infinite; }

    @keyframes breathe {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-2px); }
    }
    @keyframes workBob {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
      25% { transform: translateX(-50%) translateY(-1px) rotate(-1deg); }
      75% { transform: translateX(-50%) translateY(-1px) rotate(1deg); }
    }

    .hair {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 48px; height: 28px;
      background: #3b2f2f;
      border: 2px solid #0004;
      border-radius: 50% 50% 0 0;
      z-index: 2;
      transition: background 0.3s;
    }
    .hair.long { height: 50px; border-radius: 50% 50% 20% 20%; }
    .hair.bun::after {
      content: '';
      position: absolute;
      top: -12px; left: 50%; transform: translateX(-50%);
      width: 20px; height: 20px;
      background: inherit;
      border: 2px solid #0004;
      border-radius: 50%;
    }
    .hair.spiky {
      border-radius: 0;
      clip-path: polygon(0% 100%, 10% 0%, 30% 60%, 50% 0%, 70% 60%, 90% 0%, 100% 100%);
    }

    .head {
      position: absolute;
      top: 16px; left: 50%; transform: translateX(-50%);
      width: 44px; height: 44px;
      background: #f4c9a8;
      border: 2px solid #c99a6e;
      border-radius: 8px;
      z-index: 1;
    }
    .eye {
      position: absolute;
      top: 14px;
      width: 6px; height: 8px;
      background: #1a1a2e;
      border-radius: 2px;
      animation: blink 4s infinite;
    }
    .eye-left { left: 8px; }
    .eye-right { right: 8px; }

    @keyframes blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }

    .mouth {
      position: absolute;
      bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 12px; height: 6px;
      border-bottom: 2px solid #c99a6e;
      border-radius: 0 0 6px 6px;
    }

    .body {
      position: absolute;
      top: 56px; left: 50%; transform: translateX(-50%);
      width: 50px; height: 40px;
      background: #4a6fa5;
      border: 2px solid #2d4a6e;
      border-radius: 6px;
    }

    .arm {
      position: absolute;
      top: 62px;
      width: 14px; height: 30px;
      background: #f4c9a8;
      border: 2px solid #c99a6e;
      border-radius: 4px;
      transform-origin: top center;
    }
    .arm-left { left: 6px; transform: rotate(15deg); }
    .arm-right { right: 6px; transform: rotate(-15deg); }
    .character.working .arm-right {
      animation: typeArm 0.4s ease-in-out infinite;
    }

    @keyframes typeArm {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(-35deg); }
    }

    .desk {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 60px;
      z-index: 10;
    }
    .desk-top {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 16px;
      background: var(--desk);
      border: 2px solid var(--desk-dark);
      border-radius: 4px;
    }
    .desk-leg {
      position: absolute;
      top: 16px;
      width: 8px; height: 44px;
      background: var(--desk-dark);
      border: 1px solid #0004;
    }
    .desk-leg-left { left: 10%; }
    .desk-leg-right { right: 10%; }

    .laptop {
      position: absolute;
      top: -22px; left: 50%; transform: translateX(-50%);
      width: 60px; height: 40px;
      z-index: 3;
    }
    .laptop-screen {
      width: 100%; height: 28px;
      background: #111;
      border: 2px solid #333;
      border-radius: 3px;
    }
    .laptop-screen::after {
      content: '';
      position: absolute;
      inset: 4px;
      background: #1a3a5c;
      border-radius: 1px;
      animation: screenFlicker 2s infinite;
    }
    .character.working ~ .desk .laptop-screen::after {
      background: #2ecc71;
      box-shadow: 0 0 10px #2ecc71;
    }
    @keyframes screenFlicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.9; }
    }
    .laptop-base {
      width: 70px; height: 6px;
      background: #444;
      border-radius: 0 0 3px 3px;
      margin-left: -5px;
    }

    .name-badge {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      background: #000a;
      color: #fff;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #fff3;
      white-space: nowrap;
      z-index: 20;
    }

    .controls {
      padding: 12px;
      background: #0d1424;
      border-top: 1px solid #ffffff10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .ctrl-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ctrl-label input,
    .ctrl-label select {
      background: #1a2236;
      border: 1px solid #ffffff15;
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .ctrl-label input:focus,
    .ctrl-label select:focus { border-color: var(--accent); }

    .color-row { display: flex; gap: 6px; }
    .swatch {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .swatch:hover { border-color: #fff6; }
    .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

    /* ============ ПРАВАЯ ПАНЕЛЬ: ЧАТ ============ */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      min-width: 0;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #0a101c;
      border-bottom: 1px solid #ffffff10;
      flex-shrink: 0;
    }

    .chat-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #5a3fd6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
    }

    .chat-title { flex: 1; min-width: 0; }
    .chat-name { font-weight: 600; font-size: 15px; }
    .chat-status { font-size: 11px; color: #2ecc71; }

    .clear-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.45;
      word-wrap: break-word;
      animation: msgIn 0.25s ease-out;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--bubble-me);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.ai {
      align-self: flex-start;
      background: var(--bubble-ai);
      color: var(--text);
      border-bottom-left-radius: 4px;
      border: 1px solid #ffffff08;
    }
    .msg.typing {
      color: var(--text-dim);
      font-style: italic;
    }
    .msg.typing::after {
      content: '...';
      animation: dots 1.2s steps(4) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      background: #0a101c;
      border-top: 1px solid #ffffff10;
      flex-shrink: 0;
      padding-bottom: calc(10px + var(--safe-bottom));
    }

    .composer textarea {
      flex: 1;
      background: #1a2236;
      border: 1px solid #ffffff15;
      border-radius: 18px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 100px;
      min-height: 40px;
      line-height: 1.3;
    }
    .composer textarea:focus { border-color: var(--accent); }
    .composer textarea::placeholder { color: #5a6075; }

    .composer button {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    .composer button:disabled { opacity: 0.4; cursor: not-allowed; }
    .composer button:active:not(:disabled) { transform: scale(0.95); }

    /* ============ МОБИЛЬНАЯ АДАПТАЦИЯ ============ */
    @media (max-width: 768px) {
      .app { flex-direction: column; }

      .scene-panel {
        flex: 0 0 auto;
        height: 42dvh;
        border-right: none;
        border-bottom: 2px solid #0003;
      }

      .scene { flex: 1; min-height: 0; }

      .controls { display: none; }

      .chat-panel { flex: 1; min-height: 0; }

      .msg { max-width: 90%; font-size: 15px; }
      .chat-header { padding: 10px 12px; }
      .messages { padding: 12px; }
    }

    @media (max-width: 768px) and (orientation: landscape) {
      .app { flex-direction: row; }
      .scene-panel { flex: 0 0 38%; height: auto; border-right: 2px solid #0003; border-bottom: none; }
    }

    .mobile-settings-btn {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 30;
      background: #000a;
      border: 1px solid #fff3;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .mobile-settings-btn { display: block; }
    }

    .mobile-settings-panel {
      display: none;
      position: absolute;
      top: 40px;
      right: 8px;
      z-index: 30;
      background: #0d1424ee;
      border: 1px solid #ffffff20;
      border-radius: 12px;
      padding: 12px;
      width: 200px;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
    }
    .mobile-settings-panel.open { display: flex; }
  </style>
</head>
<body>
  <div class="app">

    <section class="scene-panel">
      <button class="mobile-settings-btn" id="mobileSettingsBtn">⚙️</button>
      <div class="mobile-settings-panel" id="mobileSettingsPanel">
        <label class="ctrl-label">
          Имя
          <input type="text" id="mobileNameInput" maxlength="16" value="Pixel" />
        </label>
        <label class="ctrl-label">
          Причёска
          <div class="color-row" id="mobileColorRow">
            <button class="swatch active" data-color="#3b2f2f" style="background:#3b2f2f"></button>
            <button class="swatch" data-color="#c0392b" style="background:#c0392b"></button>
            <button class="swatch" data-color="#f1c40f" style="background:#f1c40f"></button>
            <button class="swatch" data-color="#8e44ad" style="background:#8e44ad"></button>
            <button class="swatch" data-color="#16a085" style="background:#16a085"></button>
            <button class="swatch" data-color="#ecf0f1" style="background:#ecf0f1"></button>
          </div>
        </label>
        <label class="ctrl-label">
          Стиль
          <select id="mobileHairStyle">
            <option value="short">Короткая</option>
            <option value="long">Длинная</option>
            <option value="bun">Пучок</option>
            <option value="spiky">Ёжик</option>
          </select>
        </label>
      </div>

      <div class="scene">
        <div class="wall"></div>
        <div class="window">
          <div class="window-sky"></div>
          <div class="window-cross-v"></div>
          <div class="window-cross-h"></div>
        </div>
        <div class="plant plant-left">
          <div class="pot"></div>
          <div class="leaves">
            <span class="leaf l1"></span><span class="leaf l2"></span>
            <span class="leaf l3"></span><span class="leaf l4"></span>
          </div>
        </div>
        <div class="plant plant-right">
          <div class="pot"></div>
          <div class="leaves">
            <span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span>
          </div>
        </div>

        <div class="character" id="character">
          <div class="hair" id="hair"></div>
          <div class="head">
            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>
            <div class="mouth"></div>
          </div>
          <div class="body"></div>
          <div class="arm arm-left"></div>
          <div class="arm arm-right" id="armRight"></div>
        </div>

        <div class="desk">
          <div class="desk-top"></div>
          <div class="desk-leg desk-leg-left"></div>
          <div class="desk-leg desk-leg-right"></div>
          <div class="laptop">
            <div class="laptop-screen"></div>
            <div class="laptop-base"></div>
          </div>
        </div>

        <div class="name-badge" id="nameBadge">Pixel</div>
      </div>

      <div class="controls">
        <label class="ctrl-label">
          Имя
          <input type="text" id="nameInput" maxlength="16" value="Pixel" />
        </label>
        <label class="ctrl-label">
          Причёска
          <div class="color-row" id="colorRow">
            <button class="swatch active" data-color="#3b2f2f" style="background:#3b2f2f"></button>
            <button class="swatch" data-color="#c0392b" style="background:#c0392b"></button>
            <button class="swatch" data-color="#f1c40f" style="background:#f1c40f"></button>
            <button class="swatch" data-color="#8e44ad" style="background:#8e44ad"></button>
            <button class="swatch" data-color="#16a085" style="background:#16a085"></button>
            <button class="swatch" data-color="#ecf0f1" style="background:#ecf0f1"></button>
          </div>
        </label>
        <label class="ctrl-label">
          Стиль
          <select id="hairStyle">
            <option value="short">Короткая</option>
            <option value="long">Длинная</option>
            <option value="bun">Пучок</option>
            <option value="spiky">Ёжик</option>
          </select>
        </label>
      </div>
    </section>

    <section class="chat-panel">
      <header class="chat-header">
        <div class="chat-avatar" id="chatAvatar">P</div>
        <div class="chat-title">
          <div class="chat-name" id="chatName">Pixel</div>
          <div class="chat-status" id="chatStatus">онлайн</div>
        </div>
        <button class="clear-btn" id="clearBtn" title="Очистить чат">🗑</button>
      </header>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Напиши сообщение..." autocomplete="off"></textarea>
        <button type="submit" id="sendBtn" aria-label="Отправить">➤</button>
      </form>
    </section>

  </div>

  <script>
    // ============================================================
    // ЗАМЕНИ ЭТУ СТРОКУ НА АДРЕС ТВОЕГО ПРОКСИ НА RENDER
    // Пример: "https://gigachat-proxy-xxxx.onrender.com/api/chat"
    // ============================================================
    const API_URL = "https://gigachat-proxy-czmp.layero.app/api/chat";
    const MODEL = "GigaChat-2";

    // ============================================================
    // Дальше код можно не трогать
    // ============================================================

    const character = document.getElementById('character');
    const hairEl = document.getElementById('hair');
    const nameBadge = document.getElementById('nameBadge');
    const chatName = document.getElementById('chatName');
    const chatAvatar = document.getElementById('chatAvatar');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const composer = document.getElementById('composer');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const chatStatus = document.getElementById('chatStatus');

    let chatHistory = [];
    let isWaiting = false;

    function updateCharacter(name, color, style) {
      if (name !== undefined) {
        nameBadge.textContent = name || 'Pixel';
        chatName.textContent = name || 'Pixel';
        chatAvatar.textContent = (name || 'P').charAt(0).toUpperCase();
      }
      if (color !== undefined) {
        hairEl.style.background = color;
      }
      if (style !== undefined) {
        hairEl.className = 'hair';
        if (style !== 'short') hairEl.classList.add(style);
      }
    }

    document.getElementById('nameInput').addEventListener('input', (e) => {
      updateCharacter(e.target.value, undefined, undefined);
      document.getElementById('mobileNameInput').value = e.target.value;
    });
    document.getElementById('mobileNameInput').addEventListener('input', (e) => {
      updateCharacter(e.target.value, undefined, undefined);
      document.getElementById('nameInput').value = e.target.value;
    });

    function bindColorSwatches(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.querySelectorAll('.swatch').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const color = btn.dataset.color;
          updateCharacter(undefined, color, undefined);
          const other = containerId === 'colorRow' ? 'mobileColorRow' : 'colorRow';
          const otherEl = document.getElementById(other);
          if (otherEl) {
            otherEl.querySelectorAll('.swatch').forEach(b => {
              b.classList.toggle('active', b.dataset.color === color);
            });
          }
        });
      });
    }
    bindColorSwatches('colorRow');
    bindColorSwatches('mobileColorRow');

    document.getElementById('hairStyle').addEventListener('change', (e) => {
      updateCharacter(undefined, undefined, e.target.value);
      document.getElementById('mobileHairStyle').value = e.target.value;
    });
    document.getElementById('mobileHairStyle').addEventListener('change', (e) => {
      updateCharacter(undefined, undefined, e.target.value);
      document.getElementById('hairStyle').value = e.target.value;
    });

    const mobileSettingsBtn = document.getElementById('mobileSettingsBtn');
    const mobileSettingsPanel = document.getElementById('mobileSettingsPanel');
    mobileSettingsBtn.addEventListener('click', () => {
      mobileSettingsPanel.classList.toggle('open');
    });

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg ai typing';
      div.id = 'typingIndicator';
      div.textContent = 'думает';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function setWorking(working) {
      isWaiting = working;
      sendBtn.disabled = working;
      inputEl.disabled = working;
      chatStatus.textContent = working ? 'печатает...' : 'онлайн';
      chatStatus.style.color = working ? '#f1c40f' : '#2ecc71';
      character.classList.toggle('working', working);
    }

    function getSystemPrompt() {
      const charName = nameBadge.textContent || 'Pixel';
      return `Ты — ${charName}, пиксельный персонаж, сидящий за столом с ноутбуком. Ты дружелюбный, немного забавный и полезный. Отвечай кратко и по делу, как в чате. Не используй markdown-разметку, просто текст.`;
    }

    async function sendMessage(userText) {
      if (isWaiting || !userText.trim()) return;

      addMessage('user', userText.trim());
      chatHistory.push({ role: 'user', content: userText.trim() });
      inputEl.value = '';
      inputEl.style.height = 'auto';
      setWorking(true);
      showTyping();

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              { role: 'system', content: getSystemPrompt() },
              ...chatHistory.slice(-10)
            ]
          })
        });

        if (!response.ok) {
          const errData = await response.text();
          throw new Error(`HTTP ${response.status}: ${errData.slice(0, 200)}`);
        }

        const data = await response.json();
        const aiText = data.choices?.[0]?.message?.content || 'Извини, я не смог ответить.';

        removeTyping();
        addMessage('ai', aiText);
        chatHistory.push({ role: 'assistant', content: aiText });

      } catch (err) {
        removeTyping();
        let errorMsg = 'Ошибка: ' + err.message;
        if (err.message.includes('401') || err.message.includes('403')) {
          errorMsg = 'Проблема с ключом GigaChat. Проверь GIGACHAT_AUTH_KEY на Render.';
        } else if (err.message.includes('429')) {
          errorMsg = 'Слишком много запросов. Подожди немного.';
        } else if (err.message.includes('Failed to fetch')) {
          errorMsg = 'Не удалось подключиться к прокси. Проверь адрес Render и что сервис запущен.';
        }
        addMessage('ai', errorMsg);
        console.error('API Error:', err);
      } finally {
        setWorking(false);
        inputEl.focus();
      }
    }

    composer.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (text) sendMessage(text);
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        composer.dispatchEvent(new Event('submit'));
      }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    clearBtn.addEventListener('click', () => {
      messagesEl.innerHTML = '';
      chatHistory = [];
      addMessage('ai', 'Привет! Я ' + (nameBadge.textContent || 'Pixel') + '. Спроси меня о чём-нибудь 👋');
    });

    addMessage('ai', 'Привет! Я Pixel. Спроси меня о чём-нибудь 👋');

    if (window.innerWidth <= 768) {
      inputEl.addEventListener('focus', () => {
        setTimeout(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }, 300);
      });
    }
  </script>
</body>
</html>
